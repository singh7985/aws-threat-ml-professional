name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,infra]"

      - name: Install Node dependencies
        run: npm install

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy src infrastructure

      - name: Tests
        run: pytest --cov=threat_ml --cov-report=term-missing

      - name: CDK synth
        run: npx cdk synth
