name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,infra]"

      - name: Install Node dependencies
        run: npm install

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy src services infrastructure agent mlops

      - name: Tests
        # Fails the build if coverage drops below the fail_under gate in pyproject.toml.
        run: pytest --cov=threat_ml --cov-report=term-missing

      - name: Bandit (static security analysis)
        run: bandit -c pyproject.toml -r src services infrastructure mlops agent

      - name: pip-audit (dependency vulnerabilities)
        # Exits non-zero when any installed dependency has a known advisory.
        # --skip-editable omits the local project, which is not on PyPI and
        # therefore cannot be audited; every third-party package is still checked.
        run: pip-audit --skip-editable

      - name: CDK synth
        run: npx cdk synth
